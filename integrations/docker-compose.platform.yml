services:
  xfiles:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9999:9999"
    environment:
      - XFILES_CONFIG=/etc/xfiles/xfiles.toml
      - XFILES_API_KEY=xfiles-secret
      - RUST_LOG=info
    volumes:
      - ./configs/xfiles.toml:/etc/xfiles/xfiles.toml:ro
      - xfiles-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - awdemos

  # Local LLM endpoint (optional - enable if you have a local model)
